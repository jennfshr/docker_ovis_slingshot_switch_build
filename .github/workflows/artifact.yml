name: Package OVIS-LDMS SlingShot Switch Sampler for Debian ARM64

on:
  push:
    branches: [ "debian", "tidy" ] 
  pull_request:
    branches: [ "debian" ]
 
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch: 
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
          - info
          - warning
          - debug
      print_tags:
        description: 'True to print to STDOUT'
        required: true
        type: boolean
      tags:
        description: 'Test scenario tags'
        required: true
        type: string
      environment:
        description: 'Environment to run tests against'
        type: environment
        required: true
env:      
  DOCKER_REGISTRY: docker.io
  DOCKER_IMAGE: jkgreen76/ldms-slingshot-switch-sampler:latest
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  GPG_USERNAME: ${{ secrets.GPG_USERNAME }}
  GPG_EMAIL: ${{ secrets.GPG_EMAIL }}
  GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
  GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
  GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
  CODENAME: ovis-ldms
  COMPONENT: main
  OVIS_RELEASE: v4.5.2
  REPO_NAME: ${{ github.event.repository.name }}
  ARCHITECTURE: arm64
  
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform:
         - 'linux/arm64'
      #  - 'linux/arm64/v3' # required for act
      #  - 'linux/amd64'
      #  - 'linux/arm/v6'
      #  - 'linux/arm/v7'    
    steps:
      - name: Platform
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform}" >>$GITHUB_ENV

    # removed platform rex s/\//-/g for testing
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
 
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: 'linux/arm64/v3'
        
      - name: Set up Docker Buildx      
        uses: docker/setup-buildx-action@v3    
#        with:        
#          version: latest  

      - name: Prepare
        if: success()
        id: prepare
        run: |
          echo "docker_image=${DOCKER_REGISTRY}/${DOCKER_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "buildx_version=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "docker_platform=${PLATFORM_PAIR}" >> "$GITHUB_OUTPUT"
          echo "ovis_release=${OVIS_RELEASE}" >> "$GITHUB_OUTPUT"
          echo ":white_check_mark: Prepare Step Successful" >> $GITHUB_STEP_SUMMARY
     
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
 
      - name: Docker Login Success Output
        if: success()
        run: |
          echo ":white_check_mark: Docker Login Successful" >> $GITHUB_STEP_SUMMARY

      - name: Extract .deb package from Docker image
        uses: shrink/actions-docker-extract@v3
        id: extract
        with:
          image: ${DOCKER_IMAGE}         # Name:tag or registry URL
          path: /ovis-ldms-debian-package/ovis-ldms_4.5.2-1_arm64.deb
          destination: ldms-slingshot-sampler/.
     
      - name: Upload artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ldms-slingshot-sampler
          path: ldms-slingshot-sampler
          overwrite: true
        # e.g. /output/. or /tmp/. (must end with /. to extract contents)

    
#      - name: upload pages artifact
#        continue-on-error: true
#        uses: actions/upload-pages-artifact@v3
#        with:
#          name: github-pages
#          path: ${{ steps.create-apt-repo.outputs.dir }}
          
      - name: list directory contents of ldms-slingshot-sampler
        continue-on-error: true
        run: |
          ls -al ldms-slingshot-sampler

      - name: Upload artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ldms-slingshot-sampler
          path: ldms-slingshot-sampler
      
      - name: Artifact Upload Confirmation
  #     if: success()
        continue-on-error: true
        run: |
          echo ":white_check_mark: ovis-ldms_4.4.5-1_arm.deb artifact uploaded! :rocket:" >> $GITHUB_STEP_SUMMARY      
